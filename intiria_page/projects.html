<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore premium interior design projects by Intiria across Delhi NCR — luxury residences, corporate offices, and more.">
    <title>Our Projects | INTIRIA by ArchitectsHive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="css/desktop.css">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/sections.css">
    <link rel="stylesheet" href="sections/projects/projects.css">
</head>
<body>
    <!-- Header -->
    <div id="header-root"></div>

    <div id="projects-root"></div>

    <div id="footer-root"></div>

    <script>
        // Load header and footer
        async function loadShared() {
            const parts = [
                { id: 'header-root', url: 'sections/header/header.html' },
                { id: 'projects-root', url: 'sections/projects/projects.html' },
                { id: 'footer-root', url: 'sections/footer/footer.html' }
            ];
            for (const p of parts) {
                const res = await fetch(p.url);
                document.getElementById(p.id).innerHTML = await res.text();
            }
            const scriptsToLoad = ['sections/header/header.js', 'sections/footer/footer.js', 'js/cms_connector.js', 'js/projects_loader.js', 'js/main.js'];
            scriptsToLoad.forEach(src => {
                const s = document.createElement('script');
                s.src = src;
                document.body.appendChild(s);
            });
        }
        loadShared();
    </script>


</body>
</html>
