<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="INTIRIA by ArchitectsHive offers premium interior design packages.">
    <title>INTIRIA | Modular Architecture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="photos/Hive Tag line 11 (1).png">
    
    <!-- Global CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="css/desktop.css">
    <link rel="stylesheet" href="css/mobile.css">
    
    <!-- Component CSS -->
    <link rel="stylesheet" href="css/sections.css">
    <link rel="stylesheet" href="sections/brands/brands.css">
    <script>
        // Stub for resizeIQ to handle asynchronous loading of main.js
        window.resizeIQ = function(frame) {
            if (window.switchIQ) { // switchIQ is defined alongside real resizeIQ in main.js
                try {
                    const h = frame.contentWindow.document.body.scrollHeight;
                    if (h > 100) frame.style.height = (h + 40) + 'px';
                } catch(e) { frame.style.height = '800px'; }
            } else {
                setTimeout(() => window.resizeIQ(frame), 200);
            }
        };
    </script>
    </head>
<body>
    <div id="header-root"></div>
    <main id="top">
        <div id="hero-root"></div>
        <div id="kpi-root"></div>
        <div id="pricing-root"></div>
        <div id="residential-quote-root"></div>
        <div id="brands-root"></div>
        <div id="cta-root"></div>
    </main>
    <div id="footer-root"></div>
    <div id="booking-modal-root"></div>

    <!-- Component Loader -->
    <script>
        // Booking Modal Logic
        function openBookingModal() {
            document.getElementById('booking-modal').classList.add('active');
        }
        function closeBookingModal() {
            document.getElementById('booking-modal').classList.remove('active');
        }
        
        // Setup modal click listener after sections load
        function setupBookingModal() {
            const modal = document.getElementById('booking-modal');
            if(modal) {
                modal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        closeBookingModal();
                    }
                });
            }
        }

        async function loadModularSections() {
            const sectionsToLoad = [
                { id: 'header-root',            url: 'sections/header/header.html' },
                { id: 'hero-root',              url: 'sections/hero/hero.html' },
                { id: 'kpi-root',               url: 'sections/kpi/kpi.html' },
                { id: 'pricing-root',           url: 'sections/pricing/pricing.html' },
                { id: 'residential-quote-root', url: 'sections/residential-quote/residential-quote.html' },
                { id: 'brands-root',            url: 'sections/brands/brands.html' },
                { id: 'cta-root',               url: 'sections/cta/cta.html' },
                { id: 'footer-root',            url: 'sections/footer/footer.html' },
                { id: 'booking-modal-root',     url: 'sections/booking-modal/booking-modal.html' }
            ];

            const promises = sectionsToLoad.map(sec =>
                fetch(sec.url)
                    .then(res => {
                        if (!res.ok) throw new Error(`Failed to load ${sec.url}`);
                        return res.text();
                    })
                    .then(html => {
                        const el = document.getElementById(sec.id);
                        if (el) el.innerHTML = html;
                    })
                    .catch(err => console.warn(`[loader] Skipping ${sec.url}:`, err.message))
            );

            await Promise.all(promises);
            console.log("All modular DOM sections loaded.");
            setupBookingModal();

            // Re-initialize global JS after DOM is built
            const script = document.createElement('script');
            script.src = 'js/main.js';
            document.body.appendChild(script);

            // Load component specific JS
            const componentScripts = [
                'sections/header/header.js', 'sections/hero/hero.js', 'sections/kpi/kpi.js',
                'sections/pricing/pricing.js', 'sections/cta/cta.js', 'sections/footer/footer.js',
                'js/cms_connector.js', 'js/brands_loader.js'
            ];
            componentScripts.forEach(src => {
                const s = document.createElement('script');
                s.src = src;
                document.body.appendChild(s);
            });
        }

        // Execute loader
        loadModularSections();
    </script>
</body>
</html>
