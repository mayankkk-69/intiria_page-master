<style>
:root{
  --red:#E5341B;
  --red2:#FF5235;
  --red3:#C02A12;
  --gold:#C8A96A;
  --gold2:#E8C98A;
  --dark:#0D0C09;
  --dark2:#161410;
  --dark3:#1E1B14;
  --dark4:#26221A;
  --cream:#F4EFE6;
  --cream2:#EDE5D8;
  --muted:#7A7060;
  --muted2:#A89880;
  --border:rgba(255,255,255,0.07);
  --borderl:rgba(200,169,106,0.2);
  --ff-display:'Playfair Display',serif;
  --ff-body:'Outfit',sans-serif;
  --ff-italic:'Libre Baskerville',serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:var(--ff-body);background:var(--dark);color:var(--cream);overflow-x:hidden;line-height:1.6}

/* ── CURSOR ── */
body{cursor:none}
.cursor{position:fixed;width:10px;height:10px;background:var(--red);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:transform .15s,width .25s,height .25s,background .25s}
.cursor-ring{position:fixed;width:36px;height:36px;border:1px solid rgba(229,52,27,.5);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:transform .4s ease,width .3s,height .3s,opacity .3s}
a:hover~.cursor,.btn:hover~.cursor{width:20px;height:20px}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--dark2)}
::-webkit-scrollbar-thumb{background:var(--red);border-radius:2px}

/* ══════════════════════════════
   NAVBAR
══════════════════════════════ */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 64px;
  transition:all .4s ease;
}
nav.sticky{
  background:rgba(13,12,9,.95);
  backdrop-filter:blur(20px);
  padding:16px 64px;
  border-bottom:1px solid var(--border);
}
.nav-logo{
  font-family:var(--ff-display);font-size:26px;font-weight:700;
  letter-spacing:6px;text-decoration:none;color:var(--cream);
  text-transform:uppercase;
}
.nav-logo span{color:var(--red)}
.nav-links{display:flex;gap:40px;list-style:none}
.nav-links a{
  font-size:12px;font-weight:500;letter-spacing:2px;
  text-transform:uppercase;color:var(--muted2);text-decoration:none;
  transition:color .25s;position:relative;
}
.nav-links a::after{
  content:'';position:absolute;bottom:-4px;left:0;width:0;height:1px;
  background:var(--red);transition:width .3s;
}
.nav-links a:hover{color:var(--cream)}
.nav-links a:hover::after{width:100%}
.nav-btn{
  background:var(--red);color:#fff;border:none;
  padding:11px 28px;font-family:var(--ff-body);font-size:12px;
  font-weight:600;letter-spacing:2px;text-transform:uppercase;
  cursor:pointer;border-radius:2px;text-decoration:none;display:inline-block;
  transition:background .25s,transform .2s;
}
.nav-btn:hover{background:var(--red3);transform:translateY(-1px)}

/* ══════════════════════════════
   HERO
══════════════════════════════ */
.hero{
  position:relative;min-height:100vh;
  display:grid;grid-template-columns:1fr 400px;
  align-items:center;gap:60px;
  padding:130px 64px 80px;
  overflow:hidden;
}

/* Background layers */
.hero-bg{
  position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 70% 70% at 70% 50%, rgba(229,52,27,.07) 0%, transparent 70%),
    linear-gradient(135deg, var(--dark) 0%, #12100A 60%, #0D0C09 100%);
}
.hero-grid-lines{
  position:absolute;inset:0;z-index:0;
  background-image:
    linear-gradient(rgba(200,169,106,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(200,169,106,.04) 1px, transparent 1px);
  background-size:80px 80px;
}
.hero-grain{
  position:absolute;inset:0;z-index:0;opacity:.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  background-size:200px 200px;
}
.hero-line-v{
  position:absolute;left:64px;top:0;bottom:0;width:1px;
  background:linear-gradient(to bottom, transparent, var(--borderl), transparent);
  z-index:0;
}
.hero-line-v2{
  position:absolute;right:500px;top:0;bottom:0;width:1px;
  background:linear-gradient(to bottom, transparent, var(--border), transparent);
  z-index:0;
}
.hero-circle{
  position:absolute;right:-200px;top:50%;transform:translateY(-50%);
  width:700px;height:700px;border-radius:50%;
  border:1px solid rgba(229,52,27,.06);
  z-index:0;
}
.hero-circle2{
  position:absolute;right:-300px;top:50%;transform:translateY(-50%);
  width:900px;height:900px;border-radius:50%;
  border:1px solid rgba(200,169,106,.03);
  z-index:0;
}

.hero-content{position:relative;z-index:2}

/* SEO H1 — hidden visually but read by Google */
.seo-h1{
  font-size:11px;font-weight:500;letter-spacing:2px;
  text-transform:uppercase;color:var(--muted);
  margin-bottom:20px;display:block;
  font-family:var(--ff-body);
}
.seo-h1 span{color:var(--red)}

.hero-eyebrow{
  display:inline-flex;align-items:center;gap:10px;
  margin-bottom:28px;
  opacity:0;animation:fadeUp .7s .1s ease forwards;
}
.eyebrow-line{width:32px;height:1px;background:var(--red)}
.eyebrow-text{
  font-size:11px;font-weight:600;letter-spacing:3px;
  text-transform:uppercase;color:var(--red2);
}

/* Visual display headline */
.hero-headline{
  font-family:var(--ff-display);
  font-size:clamp(44px,5.5vw,82px);
  font-weight:500;line-height:1.05;
  margin-bottom:12px;
  opacity:0;animation:fadeUp .8s .2s ease forwards;
}
.hero-headline .line1{display:block;font-weight:400;color:var(--cream)}
.hero-headline .line2{
  display:block;font-style:italic;color:var(--red2);
  font-weight:400;
}
.hero-headline .line3{display:block;font-weight:700;color:var(--cream)}
  
.hero-sub-h2{
  font-size:13px;font-weight:500;letter-spacing:2px;
  text-transform:uppercase;color:var(--gold);
  margin-bottom:28px;
  opacity:0;animation:fadeUp .8s .3s ease forwards;
}

.hero-locations{
  display:flex;flex-wrap:wrap;gap:8px;
  margin-bottom:28px;
  opacity:0;animation:fadeUp .8s .4s ease forwards;
}
.loc-tag{
  font-size:11px;font-weight:500;letter-spacing:1.5px;
  text-transform:uppercase;
  padding:5px 14px;border-radius:100px;
  border:1px solid var(--borderl);
  color:var(--gold);background:rgba(200,169,106,.05);
}

.hero-desc{
  font-size:15.5px;color:var(--muted2);line-height:1.8;
  max-width:540px;margin-bottom:44px;
  opacity:0;animation:fadeUp .8s .5s ease forwards;
}
.hero-desc strong{color:var(--cream);font-weight:500}

.hero-actions{
  display:flex;gap:14px;flex-wrap:wrap;
  opacity:0;animation:fadeUp .8s .6s ease forwards;
}
.btn-primary{
  background:var(--red);color:#fff;border:none;
  padding:15px 38px;border-radius:2px;
  font-family:var(--ff-body);font-size:13px;font-weight:600;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;
  text-decoration:none;display:inline-block;
  transition:all .25s;
}
.btn-primary:hover{background:var(--red3);transform:translateY(-2px);box-shadow:0 12px 40px rgba(229,52,27,.3)}
.btn-ghost{
  background:transparent;color:var(--cream2);
  padding:15px 38px;border-radius:2px;
  border:1px solid rgba(255,255,255,.15);
  font-family:var(--ff-body);font-size:13px;font-weight:500;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;
  text-decoration:none;display:inline-block;
  transition:all .25s;
}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold);background:rgba(200,169,106,.05)}

/* ── HERO FORM CARD ── */
.hero-form{
  position:relative;z-index:2;
  opacity:0;animation:fadeUp .9s .3s ease forwards;
}
.form-card{
  background:rgba(26,22,16,.95);
  border:1px solid var(--borderl);
  border-radius:8px;padding:40px 32px;
  backdrop-filter:blur(24px);
  box-shadow:0 40px 100px rgba(0,0,0,.5);
}
.form-card-badge{
  display:inline-block;background:var(--red);
  color:#fff;font-size:10px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;
  padding:5px 14px;border-radius:100px;margin-bottom:16px;
}
.form-card h3{
  font-family:var(--ff-display);font-size:26px;font-weight:600;
  color:var(--cream);margin-bottom:4px;
}
.form-card h3 em{font-style:italic;color:var(--gold)}
.form-card p{font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.5}
.form-divider{width:36px;height:2px;background:var(--red);margin-bottom:24px}

.fg{margin-bottom:12px;position:relative}
.fg-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:14px;pointer-events:none;color:var(--muted);
}
.fg input,.fg select,.fg textarea{
  width:100%;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-radius:4px;
  padding:13px 14px 13px 40px;
  font-family:var(--ff-body);font-size:13.5px;
  color:var(--cream);outline:none;
  transition:border-color .2s,background .2s;
}
.fg input::placeholder,.fg textarea::placeholder{color:var(--muted)}
.fg input:focus,.fg select:focus,.fg textarea:focus{
  border-color:var(--red);background:rgba(229,52,27,.05);
}
.fg select{appearance:none;color:var(--muted)}
.fg select option{background:var(--dark3);color:var(--cream)}
.fg textarea{resize:none;height:72px;padding-top:13px}
.btn-submit{
  width:100%;background:var(--red);color:#fff;border:none;
  border-radius:4px;padding:15px;
  font-family:var(--ff-body);font-size:14px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;
  margin-top:4px;transition:all .25s;
}
.btn-submit:hover{background:var(--red3);transform:translateY(-1px);box-shadow:0 8px 30px rgba(229,52,27,.4)}
.form-lock{text-align:center;font-size:11px;color:var(--muted);margin-top:12px}

/* ══════════════════════════════
   TRUST BAR
══════════════════════════════ */
.trust{
  display:grid;grid-template-columns:repeat(3,1fr);
  margin:0 64px;
  background:rgba(26,22,16,.85);
  border:1px solid var(--borderl);border-radius:6px;
  backdrop-filter:blur(16px);
  position:relative;z-index:3;
}
.trust-item{
  display:flex;align-items:center;gap:16px;
  padding:22px 28px;
  border-right:1px solid var(--border);
}
.trust-item:last-child{border-right:none}
.t-icon{font-size:26px;flex-shrink:0}
.t-title{
  font-family:var(--ff-display);font-size:18px;font-weight:600;
  color:var(--red2);display:block;line-height:1;
}
.t-desc{font-size:12px;color:var(--muted);margin-top:3px}

/* ══════════════════════════════
   MARQUEE
══════════════════════════════ */
.marquee-outer{
  overflow:hidden;background:var(--red);
  padding:14px 0;border-top:1px solid rgba(255,255,255,.1);
}
.marquee-inner{
  display:flex;gap:0;
  animation:marquee 28s linear infinite;
  white-space:nowrap;
}
.marquee-inner:hover{animation-play-state:paused}
.m-item{
  font-family:var(--ff-body);font-size:12px;font-weight:600;
  letter-spacing:3px;text-transform:uppercase;
  color:rgba(255,255,255,.9);padding:0 36px;
}
.m-sep{color:rgba(255,255,255,.4);padding:0 8px}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ══════════════════════════════
   STATS
══════════════════════════════ */
.stats-sec{
  background:var(--dark2);
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
}
.stats-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  max-width:1200px;margin:0 auto;
}
.stat-cell{
  padding:64px 40px;text-align:center;
  border-right:1px solid var(--border);
  transition:background .3s;
}
.stat-cell:last-child{border-right:none}
.stat-cell:hover{background:rgba(229,52,27,.04)}
.stat-num{
  font-family:var(--ff-display);font-size:68px;font-weight:300;
  line-height:1;color:var(--cream);display:block;
}
.stat-num b{color:var(--red);font-weight:300}
.stat-label{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-top:10px;display:block}

/* ══════════════════════════════
   SECTION COMMONS
══════════════════════════════ */
.sec{padding:110px 64px}
.sec-inner{max-width:1200px;margin:0 auto}
.sec-label{
  display:inline-flex;align-items:center;gap:10px;
  font-size:11px;font-weight:600;letter-spacing:3px;
  text-transform:uppercase;color:var(--red2);margin-bottom:18px;
}
.sec-label::before{content:'';width:24px;height:1px;background:var(--red)}
.sec-title{
  font-family:var(--ff-display);
  font-size:clamp(34px,4vw,58px);
  font-weight:400;line-height:1.1;margin-bottom:18px;
}
.sec-title em{font-style:italic;color:var(--red2)}
.sec-body{font-size:16px;color:var(--muted2);line-height:1.8;max-width:580px}

/* ── REVEAL ── */
.reveal{opacity:0;transform:translateY(32px);transition:opacity .75s ease,transform .75s ease}
.reveal.in{opacity:1;transform:translateY(0)}

/* ══════════════════════════════
   WHY
══════════════════════════════ */
.why-sec{background:var(--dark)}
.why-layout{display:grid;grid-template-columns:1fr 1fr;gap:100px;align-items:center}
.why-features{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:48px}
.wf-card{
  padding:28px 22px;
  background:var(--dark3);
  border:1px solid var(--border);border-radius:6px;
  transition:border-color .3s,transform .3s;cursor:default;
}
.wf-card:hover{border-color:var(--borderl);transform:translateY(-4px)}
.wf-icon{font-size:26px;margin-bottom:14px;display:block}
.wf-card h4{font-size:14px;font-weight:600;margin-bottom:8px;color:var(--cream)}
.wf-card p{font-size:12.5px;color:var(--muted);line-height:1.65}

.why-visual{position:relative}
.why-img-box{
  height:580px;border-radius:8px;overflow:hidden;
  background:linear-gradient(135deg,var(--dark3),var(--dark4));
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:12px;color:var(--muted);font-size:13px;
}
.why-img-box .ph-icon{font-size:52px}
.why-badge-float{
  position:absolute;bottom:-20px;left:-32px;
  background:var(--red);padding:24px 28px;border-radius:6px;
  box-shadow:0 20px 60px rgba(229,52,27,.35);
  min-width:180px;
}
.why-badge-float .big{
  font-family:var(--ff-display);font-size:52px;font-weight:300;
  color:#fff;line-height:1;
}
.why-badge-float p{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.8);margin-top:4px}

/* ══════════════════════════════
   LOCATIONS
══════════════════════════════ */
.loc-sec{background:var(--dark2)}
.loc-grid{
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:20px;margin-top:56px;
}
.loc-card{
  background:var(--dark3);border:1px solid var(--border);
  border-radius:8px;padding:32px 22px;text-align:center;
  transition:all .3s;cursor:pointer;text-decoration:none;
  display:block;
}
.loc-card:hover{border-color:var(--borderl);background:var(--dark4);transform:translateY(-4px)}
.loc-card:hover .loc-icon-wrap{background:var(--red)}
.loc-icon-wrap{
  width:52px;height:52px;border-radius:50%;
  background:rgba(229,52,27,.12);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 18px;font-size:22px;transition:background .3s;
}
.loc-card h3{font-size:15px;font-weight:600;color:var(--cream);margin-bottom:8px}
.loc-card p{font-size:12px;color:var(--muted);line-height:1.5}
.loc-card .loc-link{
  display:inline-block;margin-top:14px;font-size:11px;
  letter-spacing:1.5px;color:var(--red2);text-transform:uppercase;
}

/* ══════════════════════════════
   SERVICES
══════════════════════════════ */
.svc-sec{background:var(--dark)}
.svc-head{
  display:flex;justify-content:space-between;align-items:flex-end;
  margin-bottom:56px;
}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.svc-card{
  background:var(--dark3);border:1px solid var(--border);
  border-radius:8px;overflow:hidden;
  transition:all .35s;cursor:pointer;
}
.svc-card:hover{border-color:var(--borderl);transform:translateY(-6px);box-shadow:0 30px 80px rgba(0,0,0,.4)}
.svc-card:hover .svc-thumb{transform:scale(1.04)}
.svc-thumb-wrap{overflow:hidden;height:220px}
.svc-thumb{
  height:100%;
  background:linear-gradient(135deg,#1E1B14,#2A2418);
  display:flex;align-items:center;justify-content:center;
  font-size:54px;transition:transform .4s;
}
.svc-body{padding:28px 24px}
.svc-num{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red2);margin-bottom:10px;display:block}
.svc-card h3{
  font-family:var(--ff-display);font-size:22px;font-weight:600;
  color:var(--cream);margin-bottom:10px;
}
.svc-card p{font-size:13px;color:var(--muted);line-height:1.65}
.svc-keywords{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.svc-kw{
  font-size:10.5px;letter-spacing:1px;
  color:var(--gold);border:1px solid var(--borderl);
  padding:4px 12px;border-radius:100px;text-transform:uppercase;
}
.svc-card.wide{grid-column:1/-1;display:grid;grid-template-columns:320px 1fr}
.svc-card.wide .svc-thumb-wrap{height:auto}

/* ══════════════════════════════
   PROCESS
══════════════════════════════ */
.proc-sec{background:var(--dark2)}
.proc-steps{
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:0;margin-top:70px;position:relative;

.proc-steps::before{

<script>
/* ── Custom Cursor ── */
const cur = document.getElementById('cur');
const curRing = document.getElementById('curRing');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{
  mx=e.clientX;my=e.clientY;
  cur.style.left=mx+'px';cur.style.top=my+'px';
});
function animRing(){
  rx+=(mx-rx)*.12;ry+=(my-ry)*.12;
  curRing.style.left=rx+'px';curRing.style.top=ry+'px';
  requestAnimationFrame(animRing);
}
animRing();
document.querySelectorAll('a,button,.loc-card,.svc-card,.wf-card').forEach(el=>{
  el.addEventListener('mouseenter',()=>{
    cur.style.width='18px';cur.style.height='18px';cur.style.background='var(--gold)';
    curRing.style.width='50px';curRing.style.height='50px';curRing.style.opacity='.6';
  });
  el.addEventListener('mouseleave',()=>{
    cur.style.width='10px';cur.style.height='10px';cur.style.background='var(--red)';
    curRing.style.width='36px';curRing.style.height='36px';curRing.style.opacity='1';
  });
});

/* ── Sticky Nav ── */
const nav = document.getElementById('nav');
window.addEventListener('scroll',()=>{
  nav.classList.toggle('sticky',window.scrollY>60);
});

/* ── Scroll Reveal ── */
const revealObserver = new IntersectionObserver((entries)=>{
  entries.forEach((e,i)=>{
    if(e.isIntersecting){
      e.target.classList.add('in');
      // stagger children
      const kids=[...e.target.querySelectorAll('.wf-card,.loc-card,.svc-card,.stat-cell,.proc-step,.testi-card')];
      kids.forEach((k,idx)=>{
        k.style.transitionDelay=`${idx*0.1}s`;
        k.style.opacity='1';k.style.transform='translateY(0)';
      });
    }
  });
},{threshold:.1});

document.querySelectorAll('.reveal').forEach(el=>{
  const kids=[...el.querySelectorAll('.wf-card,.loc-card,.svc-card,.stat-cell,.proc-step,.testi-card')];
  kids.forEach(k=>{
    k.style.opacity='0';k.style.transform='translateY(20px)';
    k.style.transition='opacity .5s ease, transform .5s ease';
  });
  revealObserver.observe(el);
});

      if(!f.value.trim()) f.style.borderColor='var(--red)';
    });
    return;
  }
  document.querySelector('.btn-submit').textContent='✓ Enquiry Sent!';
  document.querySelector('.btn-submit').style.background='#1a7a3c';
  setTimeout(()=>{
    document.querySelector('.btn-submit').textContent='Send Enquiry — It\'s Free';
    document.querySelector('.btn-submit').style.background='';
  },3000);
}

/* ── Smooth nav links ── */
document.querySelectorAll('a[href^="#"]').forEach(a=>{
  a.addEventListener('click',e=>{
    const t=document.querySelector(a.getAttribute('href'));
    if(t){e.preventDefault();t.scrollIntoView({behavior:'smooth',block:'start'})}
  });
});
</script>
