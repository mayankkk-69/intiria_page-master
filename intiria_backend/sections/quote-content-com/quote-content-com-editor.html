<div class="ib-editor-card" id="ib-quote-content-com-editor-card">
    <div class="ib-editor-card__head" data-card="ib-quote-content-com-editor-card">
        <div class="ib-editor-card__head-left">
            <div class="ib-editor-card__icon"><i class="fas fa-building"></i></div>
            <div>
                <div class="ib-editor-card__title">Commercial Quote Content</div>
                <div class="ib-editor-card__subtitle">Edit titles, descriptions, and images for Commercial forms</div>
            </div>
        </div>
        <i class="fas fa-chevron-down ib-editor-card__chevron"></i>
    </div>

    <div class="ib-editor-card__body">
        <div class="ib-form-group">
            <label class="ib-form-label">Select Plan to Edit</label>
            <select class="ib-form-input" id="ib-plan-selector-com" onchange="ibTogglePlanEditorCom()">
                <option value="com-startup">Commercial - Standard Plan</option>
                <option value="com-corporate">Commercial - Premium Plan</option>
                <option value="com-enterprise">Commercial - Elite Plan</option>
            </select>
        </div>

        <hr class="ib-section-divider">

        <div id="ib-plan-editors-container-com"></div>
    </div>

    <div class="ib-editor-card__footer">
        <button class="ib-btn-secondary" onclick="ibResetSection('quote_content_com')"><i class="fas fa-undo"></i> Reset</button>
        <button class="ib-btn-save" onclick="ibSaveSection('quote_content_com')"><i class="fas fa-save"></i> Save Commercial Content</button>
    </div>
</div>

<script>
    const comImgsDef = '/intiria_page-master/intiria_page/photos/commercial/1.JPEG, /intiria_page-master/intiria_page/photos/commercial/2.jpg, /intiria_page-master/intiria_page/photos/commercial/3.webp, /intiria_page-master/intiria_page/photos/commercial/4.webp, /intiria_page-master/intiria_page/photos/commercial/5.webp, /intiria_page-master/intiria_page/photos/commercial/6.jpeg';

    const plansCom = [
        { id: 'com-startup', name: 'Commercial - Standard Plan', defTitle: 'Standard Plan For Commercial Projects.', defDesc: 'Our Standard Plan provides essential commercial design services...', defImgs: comImgsDef },
        { id: 'com-corporate', name: 'Commercial - Premium Plan', defTitle: 'Premium Plan For Commercial Projects.', defDesc: 'Our Premium Plan provides advanced commercial design services...', defImgs: comImgsDef },
        { id: 'com-enterprise', name: 'Commercial - Elite Plan', defTitle: 'Elite Plan For Commercial Projects.', defDesc: 'Our Elite Plan provides luxury commercial design services...', defImgs: comImgsDef }
    ];

    const containerCom = document.getElementById('ib-plan-editors-container-com');
    let htmlCom = '';
    
    plansCom.forEach(plan => {
        htmlCom += `
        <div class="ib-plan-editor-group-com" id="editor-group-${plan.id}" style="display: none;">
            <div class="ib-row-label">Editing: ${plan.name}</div>
            
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-qc-${plan.id}-title">Main Title</label>
                <input class="ib-form-input" id="ib-qc-${plan.id}-title" type="text" value="${plan.defTitle}">
            </div>
            
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-qc-${plan.id}-desc">Brief Detail Description</label>
                <textarea class="ib-form-input" id="ib-qc-${plan.id}-desc" rows="4">${plan.defDesc}</textarea>
            </div>
            
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-qc-${plan.id}-imgs">Image URLs (comma separated)</label>
                <textarea class="ib-form-input" id="ib-qc-${plan.id}-imgs" rows="3">${plan.defImgs}</textarea>
                <div class="ib-upload-box__hint">Paste the paths of the images you want in the gallery carousel, separated by commas.</div>
            </div>
        </div>`;
    });
    
    containerCom.innerHTML = htmlCom;

    function ibTogglePlanEditorCom() {
        const selected = document.getElementById('ib-plan-selector-com').value;
        document.querySelectorAll('.ib-plan-editor-group-com').forEach(el => {
            el.style.display = 'none';
        });
        document.getElementById('editor-group-' + selected).style.display = 'block';
    }

    ibTogglePlanEditorCom();
</script>
