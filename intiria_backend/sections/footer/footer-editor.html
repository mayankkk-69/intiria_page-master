<div class="ib-editor-card" id="ib-footer-editor-card">

            <input class="ib-form-input" id="ib-footer-contact-email" type="email" value="contact@architectshive.com">
        </div>

        <hr class="ib-section-divider">

        <div class="ib-row-label">Social Media URLs</div>
        <div class="ib-form-grid-2">
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-footer-social-fb">Facebook</label>

            <div class="ib-form-group">
