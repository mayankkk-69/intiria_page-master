<div class="ib-editor-card" id="ib-studio-editor-card">
    <div class="ib-editor-card__head" data-card="ib-studio-editor-card">
        <div class="ib-editor-card__head-left">
            <div class="ib-editor-card__icon"><i class="fas fa-building"></i></div>
            <div>
                <div class="ib-editor-card__title">Studio Section</div>
                <div class="ib-editor-card__subtitle">Studio headline, description and gallery images</div>
            </div>
        </div>
        <i class="fas fa-chevron-down ib-editor-card__chevron"></i>
    </div>

    <div class="ib-editor-card__body">
        <div class="ib-row-label">Section Copy</div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-studio-eyebrow">Eyebrow</label>
            <input class="ib-form-input" id="ib-studio-eyebrow" type="text" value="Our Studio">
        </div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-studio-title">Title</label>
            <input class="ib-form-input" id="ib-studio-title" type="text" value="Where ideas become spaces.">
        </div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-studio-desc">Description</label>
            <textarea class="ib-form-textarea" id="ib-studio-desc">Intiria's design studio is where concepts are born, refined, and brought to life through thoughtful collaboration and precision craftsmanship.</textarea>
        </div>

        <hr class="ib-section-divider">

        <div class="ib-row-label">Studio Gallery Images</div>
        <div class="ib-form-group">
            <div class="ib-upload-box" id="ib-studio-upload-box">
                <div class="ib-upload-box__icon"><i class="fas fa-images"></i></div>
                <div class="ib-upload-box__label"><span>Click to upload</span> or drag & drop studio photos</div>
                <div class="ib-upload-box__hint">JPG / PNG / WebP - Max 2MB each</div>
                <input type="file" id="ib-studio-gallery-file" accept="image/*" multiple>
            </div>
            <div class="ib-preview-strip" id="ib-studio-gallery-preview"></div>
        </div>
        <div class="ib-form-group">
            <label class="ib-form-label">Or enter image paths manually (one per line)</label>
            <textarea class="ib-form-textarea" id="ib-studio-img-paths" placeholder="photos/studio-1.jpg&#10;photos/studio-2.jpg"></textarea>
        </div>
    </div>

    <div class="ib-editor-card__footer">
        <button class="ib-btn-secondary" onclick="ibResetSection('studio')"><i class="fas fa-undo"></i> Reset</button>
        <button class="ib-btn-save" onclick="ibSaveSection('studio')"><i class="fas fa-save"></i> Save Studio</button>
    </div>
</div>
