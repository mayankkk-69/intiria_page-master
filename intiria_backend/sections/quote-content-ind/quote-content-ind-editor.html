<div class="ib-editor-card" id="ib-quote-content-ind-editor-card">
    <div class="ib-editor-card__head" data-card="ib-quote-content-ind-editor-card">
        <div class="ib-editor-card__head-left">
            <div class="ib-editor-card__icon"><i class="fas fa-industry"></i></div>
            <div>
                <div class="ib-editor-card__title">Industrial Quote Content</div>
                <div class="ib-editor-card__subtitle">Edit titles, descriptions, and images for Industrial forms</div>
            </div>
        </div>
        <i class="fas fa-chevron-down ib-editor-card__chevron"></i>
    </div>

    <div class="ib-editor-card__body">
        <div class="ib-form-group">
            <label class="ib-form-label">Select Plan to Edit</label>
            <select class="ib-form-input" id="ib-plan-selector-ind" onchange="ibTogglePlanEditorInd()">
                <option value="ind-std">Industrial - Standard Plan</option>
                <option value="ind-prem">Industrial - Premium Plan</option>
                <option value="ind-adv">Industrial - Elite Plan</option>
            </select>
        </div>

        <hr class="ib-section-divider">

        <div id="ib-plan-editors-container-ind"></div>
    </div>

    <div class="ib-editor-card__footer">
        <button class="ib-btn-secondary" onclick="ibResetSection('quote_content_ind')"><i class="fas fa-undo"></i> Reset</button>
        <button class="ib-btn-save" onclick="ibSaveSection('quote_content_ind')"><i class="fas fa-save"></i> Save Industrial Content</button>
    </div>
</div>

<script>
    const indImgsDef = '/intiria_page-master/intiria_page/photos/industrial/1.webp, /intiria_page-master/intiria_page/photos/industrial/2.png, /intiria_page-master/intiria_page/photos/industrial/3.webp, /intiria_page-master/intiria_page/photos/industrial/4.webp, /intiria_page-master/intiria_page/photos/industrial/5.webp, /intiria_page-master/intiria_page/photos/industrial/6.webp, /intiria_page-master/intiria_page/photos/industrial/7.webp, /intiria_page-master/intiria_page/photos/industrial/8.webp';

    const plansInd = [
        { id: 'ind-std', name: 'Industrial - Standard Plan', defTitle: 'Standard Plan For Industrial Projects.', defDesc: 'Our Standard Plan provides essential industrial design services...', defImgs: indImgsDef },
        { id: 'ind-prem', name: 'Industrial - Premium Plan', defTitle: 'Premium Plan For Industrial Projects.', defDesc: 'Our Premium Plan provides advanced industrial design services...', defImgs: indImgsDef },
        { id: 'ind-adv', name: 'Industrial - Elite Plan', defTitle: 'Elite Plan For Industrial Projects.', defDesc: 'Our Elite Plan provides luxury industrial design services...', defImgs: indImgsDef }
    ];

    const containerInd = document.getElementById('ib-plan-editors-container-ind');
    let htmlInd = '';
    
    plansInd.forEach(plan => {
        htmlInd += `
        <div class="ib-plan-editor-group-ind" id="editor-group-${plan.id}" style="display: none;">
            <div class="ib-row-label">Editing: ${plan.name}</div>
            
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-qc-${plan.id}-title">Main Title</label>
                <input class="ib-form-input" id="ib-qc-${plan.id}-title" type="text" value="${plan.defTitle}">
            </div>
            
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-qc-${plan.id}-desc">Brief Detail Description</label>
                <textarea class="ib-form-input" id="ib-qc-${plan.id}-desc" rows="4">${plan.defDesc}</textarea>
            </div>
            
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-qc-${plan.id}-imgs">Image URLs (comma separated)</label>
                <textarea class="ib-form-input" id="ib-qc-${plan.id}-imgs" rows="3">${plan.defImgs}</textarea>
                <div class="ib-upload-box__hint">Paste the paths of the images you want in the gallery carousel, separated by commas.</div>
            </div>
        </div>`;
    });
    
    containerInd.innerHTML = htmlInd;

    function ibTogglePlanEditorInd() {
        const selected = document.getElementById('ib-plan-selector-ind').value;
        document.querySelectorAll('.ib-plan-editor-group-ind').forEach(el => {
            el.style.display = 'none';
        });
        document.getElementById('editor-group-' + selected).style.display = 'block';
    }

    ibTogglePlanEditorInd();
</script>
