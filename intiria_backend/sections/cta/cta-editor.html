<div class="ib-editor-card" id="ib-cta-editor-card">
    <div class="ib-editor-card__head" data-card="ib-cta-editor-card">
        <div class="ib-editor-card__head-left">
            <div class="ib-editor-card__icon"><i class="fas fa-paper-plane"></i></div>
            <div>
                <div class="ib-editor-card__title">CTA Section</div>
                <div class="ib-editor-card__subtitle">Call-to-action headline, enquiry form, and WhatsApp contact</div>
            </div>
        </div>
        <i class="fas fa-chevron-down ib-editor-card__chevron"></i>
    </div>

    <div class="ib-editor-card__body">
        <div class="ib-row-label">CTA Headline</div>
        <div class="ib-form-grid-2">
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-cta-eyebrow">Eyebrow Text</label>
                <input class="ib-form-input" id="ib-cta-eyebrow" type="text" value="GET STARTED">
            </div>
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-cta-title">Main Title</label>
                <input class="ib-form-input" id="ib-cta-title" type="text" value="Transform Your Space.">
            </div>
        </div>

        <hr class="ib-section-divider">

        <div class="ib-row-label">Enquiry Form Card</div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-cta-form-title">Form Card Title</label>
            <input class="ib-form-input" id="ib-cta-form-title" type="text" value="Submit Details">
        </div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-cta-btn-text">Enquiry Button Text</label>
            <input class="ib-form-input" id="ib-cta-btn-text" type="text" value="ENQUIRE NOW">
        </div>

        <hr class="ib-section-divider">

        <div class="ib-row-label">WhatsApp Card</div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-cta-wa-title">WhatsApp Card Title</label>
            <input class="ib-form-input" id="ib-cta-wa-title" type="text" value="Get Studio Location">
        </div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-cta-wa-btn">WhatsApp Button Text</label>
            <input class="ib-form-input" id="ib-cta-wa-btn" type="text" value="SEND TO WHATSAPP">
        </div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-cta-wa-number">WhatsApp Number (with country code)</label>
            <input class="ib-form-input" id="ib-cta-wa-number" type="text" value="+917503468992" placeholder="+917503468992">
        </div>

        <hr class="ib-section-divider">

        <div class="ib-row-label">Contact Info (Pills)</div>
        <div class="ib-cta-editor__phones">
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-cta-phone-studio">Studio Phone</label>
                <input class="ib-form-input" id="ib-cta-phone-studio" type="text" value="+917503468992">
            </div>
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-cta-phone-enquiry">Enquiry Phone</label>
                <input class="ib-form-input" id="ib-cta-phone-enquiry" type="text" value="+919958600397">
            </div>
        </div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-cta-email">Email Address</label>
            <input class="ib-form-input" id="ib-cta-email" type="email" value="contact@architectshive.com">
        </div>
    </div>

    <div class="ib-editor-card__footer">
        <button class="ib-btn-secondary" onclick="ibResetSection('cta')"><i class="fas fa-undo"></i> Reset</button>
        <button class="ib-btn-save" onclick="ibSaveSection('cta')"><i class="fas fa-save"></i> Save CTA</button>
    </div>
</div>
