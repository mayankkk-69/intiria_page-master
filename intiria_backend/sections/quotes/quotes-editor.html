<div class="ib-editor-card" id="ib-quotes-editor-card">
    <div class="ib-editor-card__head" data-card="ib-quotes-editor-card">
        <div class="ib-editor-card__head-left">
            <div class="ib-editor-card__icon"><i class="fas fa-calculator"></i></div>
            <div>
                <div class="ib-editor-card__title">Quote Calculators</div>
                <div class="ib-editor-card__subtitle">Residential, Commercial, and Industrial form headers</div>
            </div>
        </div>
        <i class="fas fa-chevron-down ib-editor-card__chevron"></i>
    </div>

    <div class="ib-editor-card__body">

        <!-- Residential Quote -->
        <div class="ib-row-label">Residential Quote Section</div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-quotes-res-title">Section Title</label>
            <input class="ib-form-input" id="ib-quotes-res-title" type="text" value="Residential Interior">
        </div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-quotes-res-desc">Description</label>
            <input class="ib-form-input" id="ib-quotes-res-desc" type="text" value="Select your plan and fill below — no calls needed.">
        </div>
        <div class="ib-form-grid-3">
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-quotes-res-tab1">Tab 1</label>
                <input class="ib-form-input" id="ib-quotes-res-tab1" type="text" value="Standard Plan">
            </div>
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-quotes-res-tab2">Tab 2</label>
                <input class="ib-form-input" id="ib-quotes-res-tab2" type="text" value="Premium Plan">
            </div>
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-quotes-res-tab3">Tab 3</label>
                <input class="ib-form-input" id="ib-quotes-res-tab3" type="text" value="Elite Plan">
            </div>
        </div>

        <hr class="ib-section-divider">

        <!-- Commercial Quote -->
        <div class="ib-row-label">Commercial Quote Section</div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-quotes-com-title">Section Title</label>
            <input class="ib-form-input" id="ib-quotes-com-title" type="text" value="Commercial Interiors">
        </div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-quotes-com-desc">Description</label>
            <input class="ib-form-input" id="ib-quotes-com-desc" type="text" value="Offices, showrooms, retail spaces, and studios — choose the scope that matches your commercial project.">
        </div>
        <div class="ib-form-grid-3">
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-quotes-com-tab1">Tab 1</label>
                <input class="ib-form-input" id="ib-quotes-com-tab1" type="text" value="Standard Plan">
            </div>
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-quotes-com-tab2">Tab 2</label>
                <input class="ib-form-input" id="ib-quotes-com-tab2" type="text" value="Premium Plan">
            </div>
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-quotes-com-tab3">Tab 3</label>
                <input class="ib-form-input" id="ib-quotes-com-tab3" type="text" value="Elite Plan">
            </div>
        </div>

        <hr class="ib-section-divider">

        <!-- Construction Quote -->
        <div class="ib-row-label">Industrial & Construction Quote Section</div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-quotes-ind-title">Section Title</label>
            <input class="ib-form-input" id="ib-quotes-ind-title" type="text" value="Industrial & Construction">
        </div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-quotes-ind-desc">Description</label>
            <input class="ib-form-input" id="ib-quotes-ind-desc" type="text" value="Factories, labs, warehouses, and process-driven facilities — select the scope that matches your project.">
        </div>
        <div class="ib-form-grid-3">
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-quotes-ind-tab1">Tab 1</label>
                <input class="ib-form-input" id="ib-quotes-ind-tab1" type="text" value="Standard Plan">
            </div>
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-quotes-ind-tab2">Tab 2</label>
                <input class="ib-form-input" id="ib-quotes-ind-tab2" type="text" value="Premium Plan">
            </div>
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-quotes-ind-tab3">Tab 3</label>
                <input class="ib-form-input" id="ib-quotes-ind-tab3" type="text" value="Elite Plan">
            </div>
        </div>

    </div>

    <div class="ib-editor-card__footer">
        <button class="ib-btn-secondary" onclick="ibResetSection('quotes')"><i class="fas fa-undo"></i> Reset</button>
        <button class="ib-btn-save" onclick="ibSaveSection('quotes')"><i class="fas fa-save"></i> Save Quotes Info</button>
    </div>
</div>
