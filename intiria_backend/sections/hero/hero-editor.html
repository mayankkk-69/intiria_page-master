<div class="ib-editor-card is-open" id="ib-hero-editor-card">
    <div class="ib-editor-card__head" data-card="ib-hero-editor-card">
        <div class="ib-editor-card__head-left">
            <div class="ib-editor-card__icon"><i class="fas fa-film"></i></div>
            <div>
                <div class="ib-editor-card__title">Hero Section</div>
                <div class="ib-editor-card__subtitle">Background video, headline, tagline, subtitle & enquiry form labels</div>
            </div>
        </div>
        <i class="fas fa-chevron-down ib-editor-card__chevron"></i>
    </div>

    <div class="ib-editor-card__body">

        <!-- Background Video -->
        <div class="ib-row-label">Background Video</div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-hero-video-path">Video File Path (relative to intiria_page/)</label>
            <input class="ib-form-input" id="ib-hero-video-path" type="text" value="videos/7.mp4" placeholder="videos/7.mp4">
            <span class="ib-hero-editor__video-path" id="ib-hero-video-preview">Current: videos/7.mp4</span>
        </div>

        <hr class="ib-section-divider">

        <!-- Kicker & Typewriter Phrases -->
        <div class="ib-row-label">Kicker & Headlines</div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-hero-kicker">Kicker Text</label>
            <input class="ib-form-input" id="ib-hero-kicker" type="text" value="Curated interior design studio">
        </div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-hero-phrase-1">Typewriter Phrase 1</label>
            <input class="ib-form-input" id="ib-hero-phrase-1" type="text" value="Spaces Designed with Presence, Calm & Impact.">
        </div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-hero-phrase-2">Typewriter Phrase 2</label>
            <input class="ib-form-input" id="ib-hero-phrase-2" type="text" value="Delhi NCR's Most Trusted Interior Design Studio">
        </div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-hero-tagline">Tagline (below headline)</label>
            <input class="ib-form-input" id="ib-hero-tagline" type="text" value="India's Top-Rated Interior Design Studio & Architecture Firm">
        </div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-hero-subtitle">Subtitle Paragraph</label>
            <textarea class="ib-form-textarea" id="ib-hero-subtitle">Intiria is a leading interior design firm in Delhi NCR, delivering thoughtfully designed residential and commercial spaces that balance aesthetics, functionality, and execution precision.</textarea>
        </div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-hero-cta-text">CTA Button Text</label>
            <input class="ib-form-input" id="ib-hero-cta-text" type="text" value="Explore Projects">
        </div>

        <hr class="ib-section-divider">

        <!-- Enquiry Form -->
        <div class="ib-row-label">Enquiry Form Card</div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-hero-form-title">Form Card Title</label>
            <input class="ib-form-input" id="ib-hero-form-title" type="text" value="Start with INTIRIA">
        </div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-hero-form-desc">Form Card Description</label>
            <input class="ib-form-input" id="ib-hero-form-desc" type="text" value="Share details and the team will guide you to our packages.">
        </div>

        <hr class="ib-section-divider">

        <!-- Bottom Benefits Bar -->
        <div class="ib-row-label">Bottom Benefits Bar</div>
        <div class="ib-form-grid-3">
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-hero-ben1-accent">Benefit 1 - Accent</label>
                <input class="ib-form-input" id="ib-hero-ben1-accent" type="text" value="30 Days">
            </div>
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-hero-ben1-text">Benefit 1 - Text</label>
                <input class="ib-form-input" id="ib-hero-ben1-text" type="text" value="Guaranteed Delivery">
            </div>
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-hero-ben1-icon">Benefit 1 - Icon (FA class)</label>
                <input class="ib-form-input" id="ib-hero-ben1-icon" type="text" value="fa-calendar-check">
            </div>
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-hero-ben2-accent">Benefit 2 - Accent</label>
                <input class="ib-form-input" id="ib-hero-ben2-accent" type="text" value="Online">
            </div>
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-hero-ben2-text">Benefit 2 - Text</label>
                <input class="ib-form-input" id="ib-hero-ben2-text" type="text" value="Secure Payments">
            </div>
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-hero-ben2-icon">Benefit 2 - Icon (FA class)</label>
                <input class="ib-form-input" id="ib-hero-ben2-icon" type="text" value="fa-lock">
            </div>
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-hero-ben3-accent">Benefit 3 - Accent</label>
                <input class="ib-form-input" id="ib-hero-ben3-accent" type="text" value="24*7">
            </div>
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-hero-ben3-text">Benefit 3 - Text</label>
                <input class="ib-form-input" id="ib-hero-ben3-text" type="text" value="Customer Support">
            </div>
            <div class="ib-form-group">
                <label class="ib-form-label" for="ib-hero-ben3-icon">Benefit 3 - Icon (FA class)</label>
                <input class="ib-form-input" id="ib-hero-ben3-icon" type="text" value="fa-headset">
            </div>
        </div>

    </div>

    <div class="ib-editor-card__footer">
        <button class="ib-btn-secondary" onclick="ibResetSection('hero')"><i class="fas fa-undo"></i> Reset</button>
        <button class="ib-btn-save" onclick="ibSaveSection('hero')"><i class="fas fa-save"></i> Save Hero</button>
    </div>
</div>
