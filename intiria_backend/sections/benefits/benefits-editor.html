<div class="ib-editor-card" id="ib-benefits-editor-card">
    <div class="ib-editor-card__head" data-card="ib-benefits-editor-card">
        <div class="ib-editor-card__head-left">
            <div class="ib-editor-card__icon"><i class="fas fa-star"></i></div>
            <div>
                <div class="ib-editor-card__title">Benefits Section</div>
                <div class="ib-editor-card__subtitle">Section headline, description, and benefit items with icons</div>
            </div>
        </div>
        <i class="fas fa-chevron-down ib-editor-card__chevron"></i>
    </div>

    <div class="ib-editor-card__body">
        <div class="ib-row-label">Section Header</div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-ben-eyebrow">Eyebrow Tag</label>
            <input class="ib-form-input" id="ib-ben-eyebrow" type="text" value="Why INTIRIA">
        </div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-ben-title">Section Title</label>
            <input class="ib-form-input" id="ib-ben-title" type="text" value="Everything you need, nothing you don't.">
        </div>
        <div class="ib-form-group">
            <label class="ib-form-label" for="ib-ben-desc">Section Description</label>
            <textarea class="ib-form-textarea" id="ib-ben-desc">From planning to execution, Intiria brings together design clarity, vendor coordination, and site accountability.</textarea>
        </div>

        <hr class="ib-section-divider">

        <div class="ib-row-label">Benefit Items</div>
        <div class="ib-list-editor" id="ib-ben-list">
            <div class="ib-list-item">
                <span class="ib-list-item__drag"><i class="fas fa-grip-vertical"></i></span>
                <input type="text" value="fa-drafting-compass" placeholder="FA Icon class" style="max-width:160px;">
                <input type="text" value="Precise Design Process" placeholder="Benefit title">
                <span class="ib-list-item__del"><i class="fas fa-times"></i></span>
            </div>
            <div class="ib-list-item">
                <span class="ib-list-item__drag"><i class="fas fa-grip-vertical"></i></span>
                <input type="text" value="fa-handshake" placeholder="FA Icon class" style="max-width:160px;">
                <input type="text" value="Vendor Coordination" placeholder="Benefit title">
                <span class="ib-list-item__del"><i class="fas fa-times"></i></span>
            </div>
            <div class="ib-list-item">
                <span class="ib-list-item__drag"><i class="fas fa-grip-vertical"></i></span>
                <input type="text" value="fa-clock" placeholder="FA Icon class" style="max-width:160px;">
                <input type="text" value="On-Time Delivery" placeholder="Benefit title">
                <span class="ib-list-item__del"><i class="fas fa-times"></i></span>
            </div>
            <div class="ib-list-item">
                <span class="ib-list-item__drag"><i class="fas fa-grip-vertical"></i></span>
                <input type="text" value="fa-shield-alt" placeholder="FA Icon class" style="max-width:160px;">
                <input type="text" value="Quality Assurance" placeholder="Benefit title">
                <span class="ib-list-item__del"><i class="fas fa-times"></i></span>
            </div>
        </div>
        <button class="ib-list-add-btn" id="ib-ben-add"><i class="fas fa-plus"></i> Add Benefit</button>
    </div>

    <div class="ib-editor-card__footer">
        <button class="ib-btn-secondary" onclick="ibResetSection('benefits')"><i class="fas fa-undo"></i> Reset</button>
        <button class="ib-btn-save" onclick="ibSaveSection('benefits')"><i class="fas fa-save"></i> Save Benefits</button>
    </div>
</div>
