<div class="ib-editor-card" id="ib-kpi-editor-card">
    <div class="ib-editor-card__head" data-card="ib-kpi-editor-card">
        <div class="ib-editor-card__head-left">
            <div class="ib-editor-card__icon"><i class="fas fa-chart-bar"></i></div>
            <div>
                <div class="ib-editor-card__title">KPI Stats Strip</div>
                <div class="ib-editor-card__subtitle">Numbers and labels for the performance highlights bar</div>
            </div>
        </div>
        <i class="fas fa-chevron-down ib-editor-card__chevron"></i>
    </div>

    <div class="ib-editor-card__body">
        <div class="ib-row-label">KPI Cards</div>
        <div class="ib-kpi-editor__card-grid">
            <div class="ib-kpi-editor__stat-card">
                <div class="ib-form-group">
                    <label class="ib-form-label" for="ib-kpi-num-1">Count Value</label>
                    <input class="ib-form-input" id="ib-kpi-num-1" type="number" value="220">
                </div>
                <div class="ib-form-group">
                    <label class="ib-form-label" for="ib-kpi-label-1">Label</label>
                    <input class="ib-form-input" id="ib-kpi-label-1" type="text" value="Projects delivered">
                </div>
            </div>
            <div class="ib-kpi-editor__stat-card">
                <div class="ib-form-group">
                    <label class="ib-form-label" for="ib-kpi-num-2">Count Value</label>
                    <input class="ib-form-input" id="ib-kpi-num-2" type="number" value="20">
                </div>
                <div class="ib-form-group">
                    <label class="ib-form-label" for="ib-kpi-label-2">Label</label>
                    <input class="ib-form-input" id="ib-kpi-label-2" type="text" value="Cities reached">
                </div>
            </div>
            <div class="ib-kpi-editor__stat-card">
                <div class="ib-form-group">
                    <label class="ib-form-label" for="ib-kpi-num-3">Count Value</label>
                    <input class="ib-form-input" id="ib-kpi-num-3" type="number" value="16">
                </div>
                <div class="ib-form-group">
                    <label class="ib-form-label" for="ib-kpi-label-3">Label</label>
                    <input class="ib-form-input" id="ib-kpi-label-3" type="text" value="Years of experience">
                </div>
            </div>
            <div class="ib-kpi-editor__stat-card">
                <div class="ib-form-group">
                    <label class="ib-form-label" for="ib-kpi-num-4">Count Value</label>
                    <input class="ib-form-input" id="ib-kpi-num-4" type="number" value="350">
                </div>
                <div class="ib-form-group">
                    <label class="ib-form-label" for="ib-kpi-label-4">Label</label>
                    <input class="ib-form-input" id="ib-kpi-label-4" type="text" value="Associate vendors">
                </div>
            </div>
            <div class="ib-kpi-editor__stat-card">
                <div class="ib-form-group">
                    <label class="ib-form-label" for="ib-kpi-num-5">Count Value</label>
                    <input class="ib-form-input" id="ib-kpi-num-5" type="number" value="30">
                </div>
                <div class="ib-form-group">
                    <label class="ib-form-label" for="ib-kpi-label-5">Label</label>
                    <input class="ib-form-input" id="ib-kpi-label-5" type="text" value="Team members">
                </div>
            </div>
        </div>
    </div>

    <div class="ib-editor-card__footer">
        <button class="ib-btn-secondary" onclick="ibResetSection('kpi')"><i class="fas fa-undo"></i> Reset</button>
        <button class="ib-btn-save" onclick="ibSaveSection('kpi')"><i class="fas fa-save"></i> Save KPIs</button>
    </div>
</div>
